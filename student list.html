<style>
body {

    margin: 0;
    padding: 0;
    overflow-x: hidden;

}

@keyframes gradientMove {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

.particle {
    position: absolute;
    border-radius: 50%;
    opacity: 0.6;
    animation: floatParticles linear infinite;
}

@keyframes floatParticles {
    0% { transform: translateY(0px) translateX(0px); }

    100% { transform: translateY(0px) translateX(0px); }

.header {

    text-align: center;
    padding: 40px 20px 60px 20px;
    z-index: 10;
}

.header img.logo {
    width: 90px;

    border-radius: 50%;

    box-shadow: 0 0 15px #00ffcc, 0 0 30px #00ffcc;

.header .school-name {

    font-weight: bold;

.class-info h2 {

th, td {

tbody tr:hover {

.help-icon.active .help-tooltip {
    display: block;
}
</style>
</head>

async function loadStudentList() {
  const tbody = document.getElementById("studentTableBody");
  tbody.innerHTML = "";

  // Get all student profiles that have tags
  const q = query(collection(db, "users"), where("accountType", "==", "student"));
  const snapshot = await getDocs(q);

  const tagMap = {};
  snapshot.forEach(doc => {
    const data = doc.data();
    if (data.index && data.tag) {
      tagMap[data.index] = {
        tag: data.tag,
        color: data.tagColor || "#00ffcc"
      };
    }
  });

  students.forEach(student => {
    const tr = document.createElement("tr");
    tr.setAttribute("data-index", student.index);

    let tagHTML = "";
    if (tagMap[student.index]) {
      const t = tagMap[student.index];
      tagHTML = `<span class="custom-tag" style="background:${t.color}">${t.tag}</span>`;
    }

    tr.innerHTML = `
      <td>${student.num}</td>
      <td>${student.name} ${tagHTML}</td>
      <td>${student.index}</td>
      <td>${student.dob}</td>
      <td><span class="${student.gender}"></span></td>
    `;

    tbody.appendChild(tr);
  });

  // Add click handlers for expandable rows
  const rows = document.querySelectorAll("#studentTableBody tr[data-index]");
  let currentlyOpen = null;

  rows.forEach(row => {
    row.addEventListener("click", function() {
      const index = this.getAttribute("data-index");

      if (currentlyOpen && currentlyOpen !== this) {
        const next = currentlyOpen.nextElementSibling;
        if (next && next.classList.contains("profile-row")) {
          next.remove();
        }
      }

      const nextRow = this.nextElementSibling;
      if (nextRow && nextRow.classList.contains("profile-row")) {
        nextRow.remove();
        currentlyOpen = null;
        return;
      }

      const newRow = document.createElement("tr");
      newRow.className = "profile-row";
      newRow.innerHTML = `
        <td colspan="5">
          <a href="view-profile.html?index=${index}" class="view-profile-btn">View Profile</a>
        </td>
      `;
      this.after(newRow);
      currentlyOpen = this;
    });
  });
}

loadStudentList();
