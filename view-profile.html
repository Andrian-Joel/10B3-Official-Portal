<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10B3 Student Profile</title>
<link rel="icon" href="https://education.gov.mv/storage/img/schools/AS/AS.png" type="image/png">

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: linear-gradient(-45deg, #0a1f2e, #004d26, #061e2a, #0a1f2e);
    background-size: 400% 400%;
    animation: gradientMove 15s ease infinite;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
}

@keyframes gradientMove {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

.profile-card {
    margin-top: 70px;
    background: rgba(0, 15, 25, 0.88);
    backdrop-filter: blur(16px);
    border: 1px solid #00ffcc44;
    border-radius: 24px;
    padding: 40px 30px;
    width: 90%;
    max-width: 420px;
    text-align: center;
    box-shadow: 0 0 40px #00ffcc22;
}

.avatar {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: linear-gradient(135deg, #00ffcc, #007a66);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    font-weight: bold;
    color: #001a14;
    margin: 0 auto 18px auto;
    border: 3px solid #00ffcc;
    box-shadow: 0 0 20px #00ffcc66;
}

.name {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 8px;
}

.tag {
    display: inline-block;
    padding: 5px 16px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 14px;
    color: #000;
}

.location {
    font-size: 14px;
    color: #7bbfad;
    margin-bottom: 22px;
}

.socials {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-bottom: 28px;
    flex-wrap: wrap;
}

.social-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(0, 255, 204, 0.1);
    border: 1px solid #00ffcc44;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.3s;
    overflow: hidden;
}

.social-btn img {
    width: 28px;
    height: 28px;
    object-fit: contain;
}

.social-btn:hover {
    background: rgba(0, 255, 204, 0.25);
    transform: translateY(-3px);
    box-shadow: 0 0 15px #00ffcc66;
}

.bio-box {
    background: rgba(0, 255, 204, 0.08);
    border: 1px solid #00ffcc33;
    border-radius: 16px;
    padding: 18px 20px;
    text-align: left;
    color: #ccffee;
    font-size: 15px;
    line-height: 1.55;
    margin-bottom: 25px;
    white-space: pre-wrap;
    word-wrap: break-word;
}

.actions {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.btn {
    display: block;
    text-decoration: none;
    padding: 13px;
    border-radius: 14px;
    font-weight: 600;
    border: 1px solid #00ffcc;
    background: rgba(0, 255, 204, 0.12);
    color: #00ffcc;
    transition: 0.3s;
}

.btn:hover {
    background: rgba(0, 255, 204, 0.25);
}

.btn-secondary {
    background: transparent;
    border: 1px solid #555;
    color: #aaa;
}

.version-badge {
    position: fixed;
    top: 20px;
    left: 20px;
    padding: 8px 16px;
    border-radius: 50px;
    background: rgba(0, 255, 204, 0.12);
    border: 1px solid #00ffcc;
    color: #00ffcc;
    font-size: 13px;
    font-weight: bold;
}

.loading {
    margin-top: 150px;
    color: #00ffcc;
    font-size: 18px;
}
</style>
</head>
<body>

<div class="version-badge">Version 2.1</div>

<div id="loading" class="loading">Loading profile...</div>

<div class="profile-card" id="profileCard" style="display:none;">
    <div class="avatar" id="avatar">?</div>
    
    <div class="name" id="displayName">Student Name</div>
    
    <div id="tagContainer"></div>
    
    <div class="location">📍 Maldives</div>
    
    <div class="socials" id="socialsContainer"></div>
    
    <div class="bio-box" id="displayBio">No bio yet.</div>
    
    <div class="actions" id="actionButtons">
        <a href="student list.html" class="btn btn-secondary">← Back to Student List</a>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCM2r1g5WZz7ksVFqqWVU-R8_SQtbq8wqc",
  authDomain: "b3-portal.firebaseapp.com",
  projectId: "b3-portal",
  storageBucket: "b3-portal.firebasestorage.app",
  messagingSenderId: "749208918769",
  appId: "1:749208918769:web:21d6dac4803d26d005a750"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const urlParams = new URLSearchParams(window.location.search);
const targetIndex = urlParams.get("index");

if (!targetIndex) {
  alert("No student selected");
  window.location.href = "student list.html";
}

let profileOwnerUid = null;

async function loadProfile() {
  try {
    const q = query(collection(db, "users"), where("index", "==", targetIndex));
    const snapshot = await getDocs(q);

    if (snapshot.empty) {
      document.getElementById("loading").textContent = "This student has not created a profile yet.";
      return;
    }

    const docSnap = snapshot.docs[0];
    const data = docSnap.data();
    profileOwnerUid = docSnap.id;

    // Avatar initials
    const names = data.fullname.trim().split(" ");
    const initials = names.length >= 2 
      ? names[0][0] + names[names.length - 1][0] 
      : names[0][0];
    document.getElementById("avatar").textContent = initials.toUpperCase();

    document.getElementById("displayName").textContent = data.fullname;

    if (data.tag) {
      document.getElementById("tagContainer").innerHTML = 
        `<div class="tag" style="background:${data.tagColor || '#00ffcc'}">${data.tag}</div>`;
    }

    document.getElementById("displayBio").textContent = data.bio || "No bio yet.";

    // Socials with real logos
    const socialsDiv = document.getElementById("socialsContainer");
    const socials = data.socials || {};
    const order = data.socialOrder || ["discord", "instagram", "tiktok", "snapchat", "roblox"];

    const logos = {
        discord: "logos/discord.png",
        instagram: "logos/instagram.png",
        tiktok: "logos/tiktok.png",
        snapchat: "logos/snapchat.png",
        roblox: "logos/roblox.png"
    };

    order.forEach(platform => {
      if (socials[platform]) {
        const a = document.createElement("a");
        a.className = "social-btn";
        a.href = socials[platform];
        a.target = "_blank";
        a.title = platform.charAt(0).toUpperCase() + platform.slice(1);
        a.innerHTML = `<img src="${logos[platform]}" alt="${platform}">`;
        socialsDiv.appendChild(a);
      }
    });

    document.getElementById("loading").style.display = "none";
    document.getElementById("profileCard").style.display = "block";

    onAuthStateChanged(auth, (user) => {
      if (user && user.uid === profileOwnerUid) {
        document.getElementById("actionButtons").innerHTML = `
          <a href="profile.html" class="btn">Edit Profile</a>
          <a href="student list.html" class="btn btn-secondary">← Back to Student List</a>
        `;
      }
    });

  } catch (error) {
    console.error(error);
    document.getElementById("loading").textContent = "Error loading profile.";
  }
}

loadProfile();
</script>

</body>
</html>
