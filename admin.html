<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10B3 Admin - Announcements</title>
<link rel="icon" href="https://education.gov.mv/storage/img/schools/AS/AS.png" type="image/png">

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: linear-gradient(-45deg, #0a1f2e, #004d26, #061e2a, #0a1f2e);
    background-size: 400% 400%;
    animation: gradientMove 15s ease infinite;
    color: white;
    display: flex;
    flex-direction: column;
}

@keyframes gradientMove {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

.header {
    text-align: center;
    padding: 40px 20px 20px 20px;
}

.header img.logo {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    border: 2px solid #00ffcc;
    box-shadow: 0 0 15px #00ffcc;
}

.header h1 {
    margin-top: 12px;
    font-size: 28px;
    text-shadow: 0 0 10px #00ffcc;
}

.container {
    max-width: 700px;
    margin: 20px auto 40px auto;
    background: rgba(0, 0, 0, 0.45);
    border: 1px solid #00ffcc33;
    border-radius: 20px;
    padding: 30px;
    backdrop-filter: blur(12px);
}

label {
    display: block;
    margin-bottom: 6px;
    font-size: 14px;
    color: #ccffee;
}

input, textarea {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #00ffcc55;
    background: rgba(0, 255, 204, 0.08);
    color: white;
    font-size: 15px;
    outline: none;
    box-sizing: border-box;
    margin-bottom: 16px;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

.btn {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 12px;
    background: rgba(0, 255, 204, 0.15);
    color: #00ffcc;
    font-size: 16px;
    font-weight: bold;
    border: 1px solid #00ffcc;
    cursor: pointer;
    transition: 0.3s;
    margin-bottom: 10px;
}

.btn:hover {
    background: rgba(0, 255, 204, 0.3);
}

.btn-secondary {
    background: rgba(255,255,255,0.08);
    border: 1px solid #666;
    color: #ccc;
}

.btn-danger {
    background: rgba(255, 80, 80, 0.15);
    border: 1px solid #ff5050;
    color: #ff8a8a;
}

.btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.message {
    margin-top: 12px;
    text-align: center;
    font-size: 14px;
}

.success { color: #00ffcc; }
.error { color: #ff6b6b; }

.back-btn {
    display: inline-block;
    margin-top: 15px;
    text-decoration: none;
    background: rgba(0, 255, 204, 0.1);
    color: #00ffcc;
    padding: 10px 22px;
    border-radius: 12px;
    font-weight: bold;
    border: 1px solid #00ffcc;
}

.version-badge {
    position: fixed;
    top: 20px;
    left: 20px;
    padding: 8px 16px;
    border-radius: 50px;
    background: rgba(0, 255, 204, 0.12);
    border: 1px solid #00ffcc;
    color: #00ffcc;
    font-size: 13px;
    font-weight: bold;
}

.footer {
    margin-top: auto;
    padding: 25px 20px;
    text-align: center;
    background: rgba(0, 0, 0, 0.45);
    border-top: 1px solid #00ffcc33;
    color: #ccffee;
    font-size: 14px;
}

.existing-title {
    color: #00ffcc;
    margin: 30px 0 15px 0;
    font-size: 20px;
}

.announcement-item {
    background: rgba(0, 255, 204, 0.06);
    border: 1px solid #00ffcc33;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
}

.announcement-item .title {
    font-weight: bold;
    color: #00ffcc;
    margin-bottom: 6px;
}

.announcement-item .content {
    font-size: 14px;
    color: #ccffee;
    margin-bottom: 12px;
    white-space: pre-wrap;
}

.announcement-item .actions {
    display: flex;
    gap: 10px;
}

.announcement-item button {
    flex: 1;
    padding: 8px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-weight: bold;
    font-size: 13px;
}

.edit-btn {
    background: rgba(0, 255, 204, 0.15);
    color: #00ffcc;
    border: 1px solid #00ffcc !important;
}

.delete-btn {
    background: rgba(255, 80, 80, 0.15);
    color: #ff8a8a;
    border: 1px solid #ff5050 !important;
}
</style>
</head>
<body>

<div class="version-badge">Version 2.1</div>

<div class="header">
    <img src="https://education.gov.mv/storage/img/schools/AS/AS.png" class="logo">
    <h1>Admin – Announcements</h1>
    <a href="index.html" class="back-btn">← Back to Main Page</a>
</div>

<div class="container" id="adminBox" style="display:none;">
    
    <h3 style="color:#00ffcc; margin-top:0;">Post New Announcement</h3>

    <label>Title</label>
    <input type="text" id="title" placeholder="Announcement title">

    <label>Content</label>
    <textarea id="content" placeholder="Write the announcement here..."></textarea>

    <button class="btn" id="postBtn" onclick="postAnnouncement()">Post Announcement</button>
    <button class="btn btn-secondary" id="cancelEditBtn" style="display:none;" onclick="cancelEdit()">Cancel Edit</button>

    <div class="message" id="message"></div>

    <!-- Existing Announcements -->
    <h3 class="existing-title">Existing Announcements</h3>
    <div id="existingList">
        <div style="text-align:center; color:#88cfc0;">Loading...</div>
    </div>
</div>

<footer class="footer">
    <div>© 2026 10B3 Official Portal. All Rights Reserved.</div>
    <div style="font-size:12px; margin-top:6px;">Developed by Andrian Joel Cooray</div>
</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, doc, getDoc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCM2r1g5WZz7ksVFqqWVU-R8_SQtbq8wqc",
  authDomain: "b3-portal.firebaseapp.com",
  projectId: "b3-portal",
  storageBucket: "b3-portal.firebasestorage.app",
  messagingSenderId: "749208918769",
  appId: "1:749208918769:web:21d6dac4803d26d005a750"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const ADMIN_INDEX = "23285";
let editingId = null;

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    alert("You must be logged in as the developer.");
    window.location.href = "login.html";
    return;
  }

  try {
    const userDoc = await getDoc(doc(db, "users", user.uid));
    
    if (!userDoc.exists() || userDoc.data().index !== ADMIN_INDEX) {
      alert("Access denied. Only the developer can access this page.");
      window.location.href = "index.html";
      return;
    }

    document.getElementById("adminBox").style.display = "block";
    loadExistingAnnouncements();

  } catch (error) {
    console.error(error);
    alert("Error checking permissions");
    window.location.href = "index.html";
  }
});

async function loadExistingAnnouncements() {
  const list = document.getElementById("existingList");
  list.innerHTML = `<div style="text-align:center; color:#88cfc0;">Loading...</div>`;

  try {
    const q = query(collection(db, "announcements"), orderBy("createdAt", "desc"));
    const snapshot = await getDocs(q);

    if (snapshot.empty) {
      list.innerHTML = `<div style="text-align:center; color:#88cfc0;">No announcements yet.</div>`;
      return;
    }

    list.innerHTML = "";

    snapshot.forEach(docSnap => {
      const data = docSnap.data();
      const id = docSnap.id;

      const div = document.createElement("div");
      div.className = "announcement-item";
      div.innerHTML = `
        <div class="title">${data.title || "Untitled"}</div>
        <div class="content">${data.content || ""}</div>
        <div class="actions">
          <button class="edit-btn" onclick="editAnnouncement('${id}', \`${(data.title || "").replace(/`/g, "\\`")}\`, \`${(data.content || "").replace(/`/g, "\\`")}\`)">Edit</button>
          <button class="delete-btn" onclick="deleteAnnouncement('${id}')">Delete</button>
        </div>
      `;
      list.appendChild(div);
    });

  } catch (error) {
    console.error(error);
    list.innerHTML = `<div style="color:#ff6b6b; text-align:center;">Error loading announcements</div>`;
  }
}

window.editAnnouncement = function(id, title, content) {
  editingId = id;
  document.getElementById("title").value = title;
  document.getElementById("content").value = content;
  document.getElementById("postBtn").textContent = "Update Announcement";
  document.getElementById("cancelEditBtn").style.display = "block";
  window.scrollTo({ top: 0, behavior: "smooth" });
};

window.cancelEdit = function() {
  editingId = null;
  document.getElementById("title").value = "";
  document.getElementById("content").value = "";
  document.getElementById("postBtn").textContent = "Post Announcement";
  document.getElementById("cancelEditBtn").style.display = "none";
  document.getElementById("message").textContent = "";
};

window.postAnnouncement = async function() {
  const title = document.getElementById("title").value.trim();
  const content = document.getElementById("content").value.trim();
  const message = document.getElementById("message");
  const btn = document.getElementById("postBtn");

  message.textContent = "";
  message.className = "message";

  if (!title || !content) {
    message.textContent = "Please fill in both title and content";
    message.className = "message error";
    return;
  }

  btn.disabled = true;
  btn.textContent = editingId ? "Updating..." : "Posting...";

  try {
    if (editingId) {
      // Update existing
      await updateDoc(doc(db, "announcements", editingId), {
        title: title,
        content: content
      });
      message.textContent = "Announcement updated successfully!";
    } else {
      // Create new
      await addDoc(collection(db, "announcements"), {
        title: title,
        content: content,
        createdAt: new Date()
      });
      message.textContent = "Announcement posted successfully!";
    }

    message.className = "message success";
    cancelEdit();
    loadExistingAnnouncements();

  } catch (error) {
    console.error(error);
    message.textContent = "Error: " + error.message;
    message.className = "message error";
  }

  btn.disabled = false;
  btn.textContent = editingId ? "Update Announcement" : "Post Announcement";
};

window.deleteAnnouncement = async function(id) {
  if (!confirm("Are you sure you want to delete this announcement?")) return;

  try {
    await deleteDoc(doc(db, "announcements", id));
    loadExistingAnnouncements();
  } catch (error) {
    console.error(error);
    alert("Error deleting announcement");
  }
};
</script>

</body>
</html>
